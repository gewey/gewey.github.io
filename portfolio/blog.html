            gap: 5px;
        }

            border-color: var(--color-primary, #00EA00);
            color: #FFF;

        .nav-tab.active {
            background: var(--color-primary, #00EA00);
            color: #000;
            font-weight: bold;

            width: 100vw;
            height: calc(100vh - 52px);
            background: #000000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .notion-frame {
            width: 100%;
            height: 100%;
