# ============================================================================
# gewey.github.io — GitHub Actions CI
# ============================================================================
name: gewey.github.io CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ─────────────────────────────────────────────────────────────────────
  # HTML Validation
  # ─────────────────────────────────────────────────────────────────────
  html-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run html-validate on all HTML files
        continue-on-error: true
        id: validate
        run: |
          npx html-validate@8 --formatter json \
            index.html \
            agents/index.html \
            bookmarks/**/index.html \
            Viktor/index.html \
            RimWorld/index.html \
            hobos/index.html \
            logs/index.html \
            AGENTS/index.html \
            AGENTS/_Template/index.html \
            AGENTS/agent1/index.html \
            AGENTS/agent2/index.html \
            AGENTS/agent3/index.html \
            AGENTS/VIKTOR/index.html \
            2>&1 | tee html-validate-results.json || true
      - name: Build html-validate report
        if: always()
        run: |
          echo "## HTML Validation" > report-html-validate.md
          echo "**Status:** completed" >> report-html-validate.md
          echo "" >> report-html-validate.md
          echo '```json' >> report-html-validate.md
          cat html-validate-results.json 2>/dev/null || echo "(no output)" >> report-html-validate.md
          echo '```' >> report-html-validate.md
      - name: Upload html-validate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-html-validate
          path: report-html-validate.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Dead Bookmark Link Checker
  # ─────────────────────────────────────────────────────────────────────
  check-bookmark-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract & check bookmark URLs
        continue-on-error: true
        id: linkcheck
        run: |
          mkdir -p ci-output
          exec 5>&1  # Save stdout
          {
            echo "Extracting URLs from dynamic*.js files..."
            grep -rohP 'href:\s*'\''[^'\'']+'\''' js/dynamic*.js \
              | sed "s/href: '//" | sed "s/'//" \
              | grep -v '^\./' | grep -v '^http://localhost' \
              > bookmark-urls.txt || true
            total=$(wc -l < bookmark-urls.txt)
            echo "Found $total external bookmark URLs to check"
            echo ""
            failed_count=0
            ok_count=0
            while IFS= read -r url; do
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "$url" 2>/dev/null || echo "FAIL")
              if [ "$status" != "200" ] && [ "$status" != "301" ] && [ "$status" != "302" ]; then
                echo "⚠️  DEAD LINK ($status): $url"
                failed_count=$((failed_count + 1))
              else
                ok_count=$((ok_count + 1))
              fi
            done < bookmark-urls.txt
            echo ""
            echo "--- Result: $ok_count OK, $failed_count dead ---"
          } | tee ci-output/linkcheck.md
      - name: Upload link check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-check-bookmark-links
          path: ci-output/linkcheck.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Image Optimization
  # ─────────────────────────────────────────────────────────────────────
  optimize-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Optimize PNG and JPEG images
        continue-on-error: true
        run: |
          mkdir -p ci-output
          {
            echo "## Image Optimization"
            echo "**Status:** complete"
            echo ""
            total_bytes=0
            for f in $(find img -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" 2>/dev/null); do
              size=$(stat -c%s "$f" 2>/dev/null || echo 0)
              total_bytes=$((total_bytes + size))
            done
            echo "Total image bytes: $total_bytes"
            echo ""
            echo "Optimization is handled by calibreapp/image-actions on push."
            echo "For manual optimization: optipng -o2 img/**/*.png && jpegoptim --strip-all img/**/*.jpg"
          } | tee ci-output/optimize.md
      - name: Upload optimize report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-optimize-images
          path: ci-output/optimize.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Service Worker Cache Manifest Integrity
  # ─────────────────────────────────────────────────────────────────────
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest.json covers all button icons
        id: manifest
        run: |
          mkdir -p ci-output
          {
            echo "## Manifest Validation"
            echo ""
            missing=0
            found=0
            for png in img/btn/bm/*.png; do
              filename=$(basename "$png")
              if ! grep -q "$filename" img/btn/bm/manifest.json; then
                echo "❌ Missing from manifest.json: $filename"
                missing=$((missing + 1))
              else
                found=$((found + 1))
              fi
            done
            echo ""
            echo "**Summary:** $found listed, $missing missing"
            echo "**Status:** $([ $missing -eq 0 ] && echo 'PASS' || echo 'FAIL - update manifest.json')"
          } | tee ci-output/manifest.md
          [ $missing -eq 0 ] || exit 1
      - name: Upload manifest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validate-manifest
          path: ci-output/manifest.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Bookmark vs Icon Consistency
  # ─────────────────────────────────────────────────────────────────────
  check-bookmark-icons:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Verify every bookmark alt has a corresponding PNG
        run: |
          mkdir -p ci-output
          {
            echo "## Bookmark Icon Check"
            echo ""
            match=0
            miss=0
            grep -rohP 'alt:\s*'\''[^'\'']+'\''' js/dynamic*.js \
              | sed "s/alt: '//" | sed "s/'//" \
              | sort -u \
              | while IFS= read -r alt; do
                  found_file=$(find img/btn/bm -maxdepth 1 -iname "${alt}.png" 2>/dev/null | head -1)
                  if [ -z "$found_file" ]; then
                    echo "❌ $alt → img/btn/bm/${alt}.png missing"
                    miss=$((miss + 1))
                  else
                    match=$((match + 1))
                  fi
                done
            echo ""
            echo "**Summary:** $match matched, $miss missing"
          } | tee ci-output/icons.md
      - name: Upload icons report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-check-bookmark-icons
          path: ci-output/icons.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # CDN Freshness Check
  # ─────────────────────────────────────────────────────────────────────
  check-cdn-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CDN library versions
        continue-on-error: true
        run: |
          mkdir -p ci-output
          {
            echo "## CDN Version Check"
            echo ""
            CURRENT=$(grep -oP 'jquery-[0-9.]+\.min\.js' js/dynamichead.js \
                      | sed 's/jquery-//' | sed 's/\.min\.js//' | head -1)
            echo "**jQuery:** current=$CURRENT"
            LATEST=$(curl -s https://api.github.com/repos/jquery/jquery/releases/latest \
                      | grep '"tag_name"' | sed 's/.*"tag_name": "//' | sed 's/".*//')
            echo "**jQuery:** latest=$LATEST"
            echo ""
            if [ "$CURRENT" != "$LATEST" ]; then
              echo "⚠️  Update available: jQuery $CURRENT → $LATEST"
            else
              echo "✅  jQuery is up to date"
            fi
            echo ""
            echo "**Note:** This is informational only."
          } | tee ci-output/cdn.md
      - name: Upload CDN report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-check-cdn-versions
          path: ci-output/cdn.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Agent Profile Integrity
  # ─────────────────────────────────────────────────────────────────────
  check-agent-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate agent profile structure
        run: |
          mkdir -p ci-output
          failed=false
          {
            echo "## Agent Profile Check"
            echo ""
            for dir in AGENTS/*/; do
              name="$(basename "$dir")"
              case "$name" in _Template|Shared) continue;; esac
              issues=""
              if [ ! -f "${dir}index.html" ]; then
                issues="$issues ❌ Missing index.html"
                failed=true
              fi
              found_md=false
              [ -f "${dir}sources/${name}.agent.md" ] && found_md=true
              [ -f "${dir}${name}.agent.md" ] && found_md=true
              if [ "$found_md" = false ]; then
                issues="$issues ⚠️  Missing .agent.md"
              fi
              if [ -z "$issues" ]; then
                echo "✅ $name"
              else
                echo "⚠️  $name:$issues"
              fi
            done
            echo ""
            echo "**Status:** $([ "$failed" = false ] && echo 'PASS' || echo 'FAIL')"
          } | tee ci-output/agents.md
          [ "$failed" = false ] || exit 1
      - name: Upload agents report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-check-agent-profiles
          path: ci-output/agents.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Lighthouse Performance Audit
  # ─────────────────────────────────────────────────────────────────────
  lighthouse-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://gewey.github.io/
            https://gewey.github.io/agents/index.html
          uploadArtifacts: true

  # ─────────────────────────────────────────────────────────────────────
  # JavaScript Syntax Check
  # ─────────────────────────────────────────────────────────────────────
  js-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check all JS files
        run: |
          mkdir -p ci-output
          {
            echo "## JavaScript Syntax Check"
            echo ""
            errors=0
            total=0
            for f in js/*.js; do
              [ -f "$f" ] || continue
              total=$((total + 1))
              if ! node --check "$f" 2>&1; then
                echo "❌ SYNTAX ERROR: $f"
                errors=$((errors + 1))
              else
                echo "✅ $f"
              fi
            done
            echo ""
            echo "**Summary:** $total files checked, $errors syntax errors"
            echo "**Status:** $([ $errors -eq 0 ] && echo 'PASS' || echo 'FAIL')"
          } | tee ci-output/js-syntax.md
          [ $errors -eq 0 ] || exit 1
        continue-on-error: true
      - name: Upload JS syntax report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-js-syntax-check
          path: ci-output/js-syntax.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # CSS Lint (stylelint)
  # ─────────────────────────────────────────────────────────────────────
  css-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run stylelint on CSS files
        continue-on-error: true
        run: |
          mkdir -p ci-output
          npm install --no-save stylelint stylelint-config-standard 2>&1 | tail -1
          {
            echo "## CSS Lint"
            echo ""
            npx stylelint "css/*.css" --formatter string 2>&1 || true
            echo ""
            echo "**Status:** completed"
          } | tee ci-output/css-lint.md
      - name: Upload CSS lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-css-lint
          path: ci-output/css-lint.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Markdown Lint
  # ─────────────────────────────────────────────────────────────────────
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint all Markdown files
        continue-on-error: true
        run: |
          mkdir -p ci-output
          {
            echo "## Markdown Lint"
            echo ""
            npx markdownlint-cli@0.43.0 \
              "*.md" \
              "AGENTS/**/*.md" \
              "Viktor/**/*.md" \
              "RimWorld/**/*.md" \
              "logs/**/*.md" \
              2>&1 || true
            echo ""
            echo "**Status:** completed"
          } | tee ci-output/markdown-lint.md
      - name: Upload markdown lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-markdown-lint
          path: ci-output/markdown-lint.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Internal Link Checker
  # ─────────────────────────────────────────────────────────────────────
  check-internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify internal links resolve
        continue-on-error: true
        run: |
          mkdir -p ci-output
          {
            echo "## Internal Link Check"
            echo ""
            broken=0
            ok=0
            # Extract href values from HTML files
            for html_file in $(find . -name "*.html" -not -path "./.git/*" -not -path "./node_modules/*" 2>/dev/null); do
              while IFS= read -r href; do
                # Skip empty, external, anchor-only, and javascript links
                [ -z "$href" ] && continue
                echo "$href" | grep -qE '^https?://' && continue
                echo "$href" | grep -qE '^#' && continue
                echo "$href" | grep -qE '^javascript:' && continue
                echo "$href" | grep -qE '^mailto:' && continue
                # Strip anchors for file check
                clean=$(echo "$href" | sed 's/#.*//' | sed 's/?.*//')
                [ -z "$clean" ] && continue
                # Resolve relative to the file's directory
                dir=$(dirname "$html_file")
                target="$dir/$clean"
                if [ -f "$target" ] || [ -d "$target" ]; then
                  ok=$((ok + 1))
                else
                  echo "❌ BROKEN in $html_file → $href"
                  broken=$((broken + 1))
                fi
              done < <(grep -ohrP 'href="[^"]*"' "$html_file" 2>/dev/null | sed 's/href="//;s/"//')
            done
            echo ""
            echo "**Summary:** $ok OK, $broken broken"
            echo "**Status:** $([ $broken -eq 0 ] && echo 'PASS' || echo 'FAIL - fix broken internal links')"
          } | tee ci-output/internal-links.md
          [ $broken -eq 0 ] || exit 1
      - name: Upload internal links report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-check-internal-links
          path: ci-output/internal-links.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Accessibility Audit (pa11y)
  # ─────────────────────────────────────────────────────────────────────
  a11y-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run pa11y accessibility checks
        continue-on-error: true
        run: |
          mkdir -p ci-output
          npm install --no-save pa11y 2>&1 | tail -1
          {
            echo "## Accessibility Audit (pa11y)"
            echo ""
            pages=(
              "index.html"
              "agents/index.html"
              "bookmarks/all.html"
              "bookmarks/index.html"
              "logs/index.html"
            )
            total_issues=0
            for page in "${pages[@]}"; do
              if [ -f "$page" ]; then
                echo "### $page"
                result=$(npx pa11y "$page" 2>&1) || true
                count=$(echo "$result" | grep -c "error" || true)
                total_issues=$((total_issues + count))
                if [ -n "$result" ]; then
                  echo "$result"
                else
                  echo "✅ No issues"
                fi
                echo ""
              fi
            done
            echo "**Total issues:** $total_issues"
            echo "**Status:** $([ $total_issues -eq 0 ] && echo 'PASS' || echo 'WARN - review accessibility issues')"
          } | tee ci-output/a11y.md
      - name: Upload a11y report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-a11y-audit
          path: ci-output/a11y.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Asset Budget Check
  # ─────────────────────────────────────────────────────────────────────
  asset-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check asset sizes against budget
        continue-on-error: true
        run: |
          mkdir -p ci-output
          {
            echo "## Asset Budget Check"
            echo ""
            echo "| Asset | Size | Status |"
            echo "|-------|------|--------|"
            exceeded=0

            # Check HTML files — warn if > 100KB
            for f in $(find . -name "*.html" -not -path "./.git/*" -not -path "./node_modules/*" 2>/dev/null); do
              size=$(stat -c%s "$f" 2>/dev/null || echo 0)
              kb=$((size / 1024))
              if [ "$size" -gt 102400 ]; then
                echo "| $f | ${kb}KB | ⚠️ Over 100KB |"
                exceeded=$((exceeded + 1))
              fi
            done

            # Check JS files — warn if > 50KB
            for f in js/*.js; do
              [ -f "$f" ] || continue
              size=$(stat -c%s "$f" 2>/dev/null || echo 0)
              kb=$((size / 1024))
              if [ "$size" -gt 51200 ]; then
                echo "| $f | ${kb}KB | ⚠️ Over 50KB |"
                exceeded=$((exceeded + 1))
              fi
            done

            # Check CSS files — warn if > 30KB
            for f in css/*.css; do
              [ -f "$f" ] || continue
              size=$(stat -c%s "$f" 2>/dev/null || echo 0)
              kb=$((size / 1024))
              if [ "$size" -gt 30720 ]; then
                echo "| $f | ${kb}KB | ⚠️ Over 30KB |"
                exceeded=$((exceeded + 1))
              fi
            done

            # Check images — warn if > 500KB
            for f in $(find img -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" -o -name "*.svg" \) 2>/dev/null); do
              size=$(stat -c%s "$f" 2>/dev/null || echo 0)
              kb=$((size / 1024))
              if [ "$size" -gt 512000 ]; then
                echo "| $f | ${kb}KB | ⚠️ Over 500KB |"
                exceeded=$((exceeded + 1))
              fi
            done

            echo ""
            echo "**Assets over budget:** $exceeded"
            echo "**Status:** $([ $exceeded -eq 0 ] && echo 'PASS' || echo 'WARN - review asset sizes')"
          } | tee ci-output/asset-budget.md
      - name: Upload asset budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-asset-budget
          path: ci-output/asset-budget.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Service Worker Validation
  # ─────────────────────────────────────────────────────────────────────
  validate-sw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate service worker and cache URLs
        continue-on-error: true
        run: |
          mkdir -p ci-output
          {
            echo "## Service Worker Validation"
            echo ""
            if [ ! -f "js/sw.js" ]; then
              echo "❌ No service worker found at js/sw.js"
            else
              echo "✅ Service worker found at js/sw.js"
              echo ""
              # Extract cached URLs from the service worker
              echo "### Cached Resources"
              cached_urls=$(grep -oP "(?<=')[^']+(?=')" js/sw.js 2>/dev/null \
                | grep -E '\.(html|js|css|png|jpg|json)$' || true)
              missing=0
              found=0
              while IFS= read -r url; do
                [ -z "$url" ] && continue
                # Strip leading ./ or /
                clean=$(echo "$url" | sed 's|^\.\/||' | sed 's|^/||')
                if [ -f "$clean" ]; then
                  found=$((found + 1))
                else
                  echo "❌ Cached but missing: $url"
                  missing=$((missing + 1))
                fi
              done <<< "$cached_urls"
              echo ""
              echo "**Summary:** $found found, $missing missing from cache list"
              echo "**Status:** $([ $missing -eq 0 ] && echo 'PASS' || echo 'FAIL - update sw.js cache list')"
            fi
          } | tee ci-output/sw-check.md
      - name: Upload service worker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-validate-sw
          path: ci-output/sw-check.md
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Generate Consolidated HTML Report
  # ─────────────────────────────────────────────────────────────────────
  generate-report:
    runs-on: ubuntu-latest
    needs:
      - html-validate
      - check-bookmark-links
      - optimize-images
      - validate-manifest
      - check-bookmark-icons
      - check-cdn-versions
      - check-agent-profiles
      - lighthouse-check
      - js-syntax-check
      - css-lint
      - markdown-lint
      - check-internal-links
      - a11y-audit
      - asset-budget
      - validate-sw
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts
      - name: Build consolidated HTML report
        run: |
          TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          COMMIT="${{ github.sha }}"
          BRANCH="${{ github.ref_name }}"

          # Count job artifacts
          JOBS=0
          for d in artifacts/report-*/; do
            [ -d "$d" ] && JOBS=$((JOBS + 1))
          done

          # Start building report
          {
            echo "<!DOCTYPE html>"
            echo "<html lang=\"en\">"
            echo "<head>"
            echo "<meta charset=\"UTF-8\">"
            echo "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">"
            echo "<title>gewey.github.io - CI Report</title>"
            echo "<style>"
            echo "  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 20px; margin: 0; }"
            echo "  h1 { color: #00ea00; font-family: 'Courier New', monospace; margin-bottom: 4px; }"
            echo "  .meta { color: #888; font-size: 13px; margin-bottom: 20px; }"
            echo "  h2 { color: #00ea00; font-family: 'Courier New', monospace; margin: 24px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #333; }"
            echo "  .job { background: #111; border: 1px solid #222; border-radius: 8px; margin: 10px 0; overflow: hidden; }"
            echo "  .job-pass { border-left: 4px solid #00ea00; }"
            echo "  .job-fail { border-left: 4px solid #ea0000; }"
            echo "  .job-warn { border-left: 4px solid #eaea00; }"
            echo "  .job-body { padding: 12px 16px; font-family: 'Courier New', monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; background: #0d0d0d; max-height: 600px; overflow-y: auto; }"
            echo "  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin: 16px 0; }"
            echo "  .stat-card { background: #111; border: 1px solid #222; border-radius: 8px; padding: 14px; text-align: center; }"
            echo "  .stat-value { font-size: 24px; font-weight: bold; font-family: 'Courier New', monospace; }"
            echo "  .stat-label { font-size: 11px; color: #888; margin-top: 2px; }"
            echo "  .green { color: #00ea00; }"
            echo "  .red { color: #ea0000; }"
            echo "  .yellow { color: #eaea00; }"
            echo "  ::-webkit-scrollbar { width: 8px; }"
            echo "  ::-webkit-scrollbar-track { background: #0d0d0d; }"
            echo "  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }"
            echo "</style>"
            echo "</head>"
            echo "<body>"
            echo "<h1>gewey.github.io - CI Report</h1>"
            echo "<p class=\"meta\">Generated: $TIMESTAMP | Commit: $COMMIT | Branch: $BRANCH</p>"
            echo '<div class="summary-grid">'
            echo "<div class=\"stat-card\"><div class=\"stat-value green\">$JOBS</div><div class=\"stat-label\">Jobs</div></div>"
            echo '<div class="stat-card"><div class="stat-value green\">OK</div><div class="stat-label">Auto-generated</div></div>'
            echo '</div>'
          } > report.html

          # Each job report — deduplicate by tracking seen filenames
          SEEN=""
          for report_file in artifacts/report-*/*.md; do
            [ -f "$report_file" ] || continue
            base=$(basename "$report_file")
            # Skip if already processed
            echo "$SEEN" | grep -qxF "$base" 2>/dev/null && continue
            SEEN=$(printf '%s\n%s' "$SEEN" "$base")
            fname=${base%.md}
            fname=${fname#report-}
            job_name=$(echo "$fname" | tr '-' ' ')
            {
              echo "<h2>$job_name</h2>"
              echo '<div class="job job-warn"><div class="job-body">'
              cat "$report_file"
              echo '</div></div>'
            } >> report.html
          done

          # Lighthouse reports
          for lh_file in artifacts/lighthouse-check/*.html; do
            [ -f "$lh_file" ] || continue
            {
              echo "<h2>Lighthouse Report</h2>"
              echo '<div class="job job-pass"><div class="job-body">'
              echo "<a href=\"$(basename "$lh_file")\" target=\"_blank\">Open full Lighthouse report: $(basename "$lh_file")</a>"
              echo '</div></div>'
            } >> report.html
          done 2>/dev/null || true

          # Footer
          echo '<p style="margin-top:40px; color:#555; font-size:12px;">Report auto-generated by gewey.github.io CI workflow.</p>' >> report.html
          echo '</body>' >> report.html
          echo '</html>' >> report.html

          echo "Report built: $(wc -c < report.html) bytes"
          mkdir -p ci-report
          cp report.html ci-report/
      - name: Upload CI Report
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report/
          compression-level: 0

  # ─────────────────────────────────────────────────────────────────────
  # Stage 3: Post-Report Actions
  # ─────────────────────────────────────────────────────────────────────

  # ──── PR Comment with Report Summary ──────────────────────────────────
  pr-comment-report:
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download CI report artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-report
          path: ci-report
      - name: Post summary comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sha = context.sha.slice(0, 7);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Read the HTML report to extract pass/fail counts
            let body = `## 🤖 CI Report — \`${sha}\`\n\n`;
            body += `| | |\n|---|---|\n`;
            body += `| **Workflow** | [View full run](${runUrl}) |\n`;
            body += `| **Branch** | \`${context.payload.pull_request.head.ref}\` |\n`;
            body += `| **Commit** | \`${context.sha}\` |\n\n`;

            // Try to read the HTML report for job count
            try {
              const html = fs.readFileSync('ci-report/report.html', 'utf8');
              const jobMatch = html.match(/stat-value[^>]*>(\d+)<\/div><div class="stat-label">Jobs/);
              if (jobMatch) {
                body += `**${jobMatch[1]}** checks completed. See the [full report artifact](${runUrl}) for details.\n\n`;
              }
            } catch (e) {
              body += `Report generated. See the [full report artifact](${runUrl}) for details.\n\n`;
            }

            body += `---\n*Generated by gewey.github.io CI*`;

            // Find and update existing comment, or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('CI Report —')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  # ──── Create GitHub Issue on Critical Failure ─────────────────────────
  create-failure-issue:
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      issues: write
    steps:
      - name: Download CI report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ci-report
          path: ci-report
      - name: Check for failures and create issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let createIssue = false;
            let failures = [];

            try {
              const html = fs.readFileSync('ci-report/report.html', 'utf8');
              // Check if any sections have FAIL status indicators
              const failPattern = /FAIL|❌|SYNTAX ERROR|BROKEN/g;
              const matches = html.match(failPattern);
              if (matches && matches.length > 0) {
                createIssue = true;
                failures = matches.slice(0, 5); // cap at 5 for body
              }
            } catch (e) {
              console.log('Could not read report, skipping issue creation');
              return;
            }

            if (!createIssue) {
              console.log('No failures detected, skipping issue creation');
              return;
            }

            // Check for duplicate open issues
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ci-failure',
              per_page: 5,
            });

            const today = new Date().toISOString().split('T')[0];
            const dup = existingIssues.find(i => i.title.includes(today));
            if (dup) {
              console.log(`Duplicate issue already exists: #${dup.number}`);
              return;
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.sha.slice(0, 7);

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 CI Failures on ${today} (${sha})`,
              labels: ['ci-failure'],
              body: [
                `## CI Pipeline Failures`,
                ``,
                `| | |`,
                `|---|---|`,
                `| **Commit** | \`${context.sha}\` |`,
                `| **Branch** | \`${context.ref_name}\` |`,
                `| **Run** | [View logs](${runUrl}) |`,
                `| **Date** | ${today} |`,
                ``,
                `### Detected Failures`,
                ``,
                failures.map(f => `- ${f}`).join('\n'),
                ``,
                `---`,
                `*Auto-created by gewey.github.io CI workflow. Close this issue once resolved.*`,
              ].join('\n'),
            });
            console.log('Created failure issue');

  # (deploy-pages removed — GitHub Pages auto-deploys on push to main)
